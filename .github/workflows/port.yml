name: Windows and iPhone port checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project Windows/GooglyWindows.Tests -c Release
      - run: python3 scripts/check-port.py
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build Windows/GooglyWindows.sln -c Release
      - run: dotnet run --project Windows/GooglyWindows.Tests -c Release --no-build
      - run: dotnet publish Windows/GooglyWindows -c Release -r win-x64 --self-contained true -o artifacts/windows
      - uses: actions/upload-artifact@v4
        with:
          name: GooglyEyes-Windows-x64
          path: artifacts/windows
  iphone:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -project GooglyEyes.xcodeproj -scheme GooglyEyes -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
